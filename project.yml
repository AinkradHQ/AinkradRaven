name: AinkradRaven
options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    EAGER_LINKING: NO
packages:
  AinkradAppKit:
    url: https://github.com/AinkradHQ/AinkradAppKit
    # At or BEHIND the revision the host's build checks out, never ahead.
    # Verify, never copy:
    #   git -C ../Ainkrad/build/SourcePackages/checkouts/AinkradAppKit rev-parse HEAD
    # Generation 9: HostServices.signals.
    #
    # "EXACTLY" is what this said, and it was wrong: the host advances whenever
    # the SDK gains something it needs, and plugins lag until they have a reason
    # to move. Behind is not automatically safe either — a public declaration
    # removed, or merely given a defaulted parameter, re-mangles its symbol and
    # kills `Bundle.load()` for a plugin still linking the old one. See
    # AinkradQuest's project.yml for the full rule and the check commands.
    # c315110: generation 11 -- Basic Mode. NOT releasable until an installed
    # host is generation 11.
    # 43868c9: AinkradSurfaceSettings -- the shared Open as / Open in rows.
    revision: 43868c968b8c4111f7cfa7d05fd903fcc9277d63
targets:
  RavenFeature:
    type: library.static
    platform: macOS
    sources: [Sources/RavenFeature]
    dependencies:
      - package: AinkradAppKit
        embed: false
  RavenPlugin:
    type: bundle
    platform: macOS
    sources: [Sources/RavenPlugin]
    postBuildScripts:
      - script: '"$SRCROOT/scripts/stamp-api-version.sh"'
        name: Stamp AinkradAPIVersion
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    dependencies:
      - target: RavenFeature
      - package: AinkradAppKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.plugin.raven
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/RavenPlugin/Info.plist
        MACH_O_TYPE: mh_bundle
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        OTHER_LDFLAGS: ["-lRavenFeature"]
  RavenFeatureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/RavenFeatureTests
      - path: Tests/RavenFeatureTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: RavenFeature
      - package: AinkradAppKit
  # Dev-only command-line harness for exercising the real GmailAuth OAuth
  # flow against real Google traffic — RavenPlugin is a bundle and cannot be
  # run directly. Deliberately NOT a dependency of RavenPlugin and never
  # embedded in it; it is a sibling consumer of RavenFeature, same as
  # RavenFeatureTests.
  RavenDevAuth:
    type: tool
    platform: macOS
    sources: [Sources/RavenDevAuth]
    dependencies:
      - target: RavenFeature
      - package: AinkradAppKit
        embed: false
schemes:
  RavenPlugin:
    build: { targets: { RavenPlugin: all, RavenFeatureTests: [test] } }
    test:  { config: Debug, targets: [RavenFeatureTests] }
  RavenDevAuth:
    build: { targets: { RavenDevAuth: all } }
    run: { config: Debug }
